<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690">
<style>text{font-family:Arial,sans-serif;fill:#102644}.title{font-size:31px;font-weight:700}.head{font-size:25px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#566b88}.blue{fill:#1468ed}.white{fill:white}.tag{font-size:13px;font-weight:700;fill:#1468ed}</style>
<rect width="1500" height="690" fill="#edf4ff"/><text class="title" x="48" y="58">НайдиGo: три связанных сценария</text><text class="small" x="49" y="86">Схема продукта, не скриншоты действующих функций</text>
<g transform="translate(40 120)"><rect width="445" height="520" rx="24" fill="white" stroke="#d5e3f8"/><text class="tag" x="25" y="40">ПОКУПАТЕЛЬ · ОСНОВА</text><text class="head" x="25" y="82">Найти рядом</text><rect x="25" y="110" width="395" height="64" rx="16" fill="#f1f6ff"/><text class="body" x="45" y="150">«Нужна дрель для бетона»</text><rect x="25" y="192" width="395" height="60" rx="14" fill="#e8f1ff"/><text class="body" x="45" y="228">Город и точка пользователя</text><rect x="25" y="269" width="395" height="104" rx="14" fill="#f7faff" stroke="#d5e3f8"/><text class="body" x="45" y="302">Карточки найденных предложений</text><text class="small" x="45" y="330">Фото · цена, если известна · продавец</text><text class="small" x="45" y="352">источник · известный адрес</text><rect x="25" y="392" width="190" height="50" rx="12" fill="#1468ed"/><text class="body white" x="73" y="423">Продавец</text><rect x="230" y="392" width="190" height="50" rx="12" fill="#e8f1ff"/><text class="body blue" x="285" y="423">Маршрут</text><text class="small" x="25" y="483">Поиск и просмотр без регистрации</text></g>
<g transform="translate(525 120)"><rect width="445" height="520" rx="24" fill="white" stroke="#d5e3f8"/><text class="tag" x="25" y="40">ПОМОЩНИК · РАЗВИВАЕМ</text><text class="head" x="25" y="82">Помочь с выбором</text><rect x="25" y="111" width="395" height="85" rx="14" fill="#f1f6ff"/><text class="body" x="45" y="145">«Подойдёт ли эта дрель?»</text><text class="small" x="45" y="173">Уточняет задачу и объясняет варианты</text><rect x="25" y="214" width="395" height="92" rx="14" fill="#f7faff" stroke="#d5e3f8"/><text class="body" x="45" y="249">Готовит вопрос продавцу</text><text class="small" x="45" y="278">Человек проверяет и отправляет сам</text><rect x="25" y="324" width="395" height="114" rx="14" fill="#fff7e9"/><text class="body" x="45" y="359">Позже: переговоры и поручения</text><text class="small" x="45" y="388">Только с полномочиями, подтверждением</text><text class="small" x="45" y="411">и ограничением затрат</text><text class="small" x="25" y="483">Автономные переговоры ещё не готовы</text></g>
<g transform="translate(1010 120)"><rect width="445" height="520" rx="24" fill="white" stroke="#d5e3f8"/><text class="tag" x="25" y="40">ПРОДАВЕЦ · УПРОСТИТЬ</text><text class="head" x="25" y="82">Быстро разместить</text><rect x="25" y="111" width="395" height="62" rx="14" fill="#f1f6ff"/><text class="body" x="45" y="150">Магазин или объявление</text><rect x="25" y="188" width="395" height="88" rx="14" fill="#f7faff" stroke="#d5e3f8"/><text class="body" x="45" y="223">Фото · сайт · Excel · вручную</text><text class="small" x="45" y="251">AI предлагает черновик</text><rect x="25" y="292" width="395" height="85" rx="14" fill="#e8f1ff"/><text class="body" x="45" y="325">Проверить и опубликовать</text><text class="small" x="45" y="352">Цена, количество и место — от продавца</text><rect x="25" y="394" width="395" height="65" rx="14" fill="#fff7e9"/><text class="body" x="45" y="422">Позже: править каталог голосом</text><text class="small" x="45" y="445">с подтверждением изменений</text><text class="small" x="25" y="483">Управление голосом ещё не готово</text></g>
</svg>
